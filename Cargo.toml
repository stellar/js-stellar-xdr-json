[package]
name = "stellar-xdr-json"
version = "28.0.0"
edition = "2021"
publish = false
repository = "https://github.com/stellar/js-stellar-xdr-json"
rust-version = "1.86.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
schemars = "0.8.16"
serde_json = "1.0.114"
console_error_panic_hook = { version = "0.1.7", optional = true }
# TODO: For use with generating native values.
# serde-wasm-bindgen = "0.6.5"

# Protocol 30 (CAP-0087) SPIKE: pinned to rs-stellar-xdr PR #583
# (f1b0285df1a0cac98aee0ba627c03f307c622cf2), whose xdr submodule is
# stellar-xdr PR #318 head (84cd9fa6c9ebe162e1d9dbbe89be9b6835498456).
[dependencies.stellar-xdr]
version = "28.0.0"
git = "https://github.com/sisuresh/rs-stellar-xdr"
rev = "f1b0285df1a0cac98aee0ba627c03f307c622cf2"
features = ["std", "base64", "serde", "serde_json", "schemars", "type_enum", "cap_0087_ml_dsa"]

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.dev]
opt-level = "z"
debug = 0
strip = "symbols"

[profile.release]
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
